<h1>砂泥岩岩性识别规则</h1>
<div class="category">岩性解释</div>

<div class="summary">根据伽玛、密度、声波、电阻率曲线组合判断砂泥岩</div>

<h2>方法细节</h2>

<div class="detail-card">
<h3>砂岩识别</h3>
<p>GR 低、密度正常、声波正常、电阻率不高</p>
</div>

<div class="detail-card">
<h3>泥岩识别</h3>
<p>GR 高、密度偏高、声波偏高、电阻率低</p>
</div>

<div class="detail-card">
<h3>误判修正</h3>
<p>GR 不低但密度<2.6、声波~100us/ft、电阻率不高、无气测异常，应判为泥岩而非砂岩</p>
</div>

<div class="applicable">
<h2 style="margin-top:0; border:none; padding:0;">适用条件</h2>
<p>砂泥岩剖面</p>
</div>

<div class="application">
<h2 style="margin-top:0; border:none; padding:0;">应用案例</h2>
<p>BET-1 井 7390-7408ft、7549-7585ft 误判修复</p>
