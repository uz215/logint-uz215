<h3>REG 综合气层指示法</h3>
<p>针对气田地区，综合三种指示识别气层：</p>
<ul>
<li><strong>RTI（电阻率-孔隙度重叠）</strong>：水层/非储层处重合，气层处两曲线向电阻率大方向张开</li>
<li><strong>NDI（中子-密度挖掘效应指标）</strong>：中子密度曲线分离程度</li>
<li><strong>GSI（气测异常指标）</strong>：气测值与背景值的比值</li>
</ul>
