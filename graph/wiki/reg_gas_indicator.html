<h1>REG 综合气层指示法</h1>
<div class="category">气层识别</div>

<div class="summary">针对气田地区，综合三种指示识别气层</div>

<h2>方法细节</h2>

<div class="detail-card">
<h3>RTI（电阻率-孔隙度重叠）</h3>
<p>水层/非储层处重合，气层处两曲线向电阻率大方向张开</p>
</div>

<div class="detail-card">
<h3>NDI（中子-密度挖掘效应指标）</h3>
<p>中子密度曲线分离程度，气层处分离明显</p>
</div>

<div class="detail-card">
<h3>GSI（气测异常指标）</h3>
<p>气测值与背景值的比值，气层处气测异常明显</p>
</div>

<div class="applicable">
<h2 style="margin-top:0; border:none; padding:0;">适用条件</h2>
<p>砂泥岩剖面、气层为主的地区（孟加拉、澳洲等）</p>
</div>

<div class="application">
<h2 style="margin-top:0; border:none; padding:0;">应用案例</h2>
<p>孟加拉 Titas-31、Rashidpur-13 等气田验证有效</p>
